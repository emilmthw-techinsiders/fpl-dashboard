name: Refresh Inferno FPL data

# Real, confirmed finding (2026-08-30): a */5 schedule here is NOT reliably
# honored by GitHub's scheduler for a frequent cron like this - measured
# directly from real run history, gaps between actual firings grew from
# ~15-30 min (when this was first set up) to 3-11+ hours over a few days.
# This matches GitHub's own documented behavior: scheduled workflows are
# explicitly best-effort, get deprioritized under platform load, and
# frequent (every-few-minutes) schedules are the ones most affected -
# community reports consistently describe LESS frequent schedules (15+
# min) being honored far more consistently than aggressive ones. Declaring
# 15 minutes here isn't a downgrade in the sense of asking for less than
# we want - the */5 declaration was never actually being delivered at
# anywhere close to */5 in practice, so this asks for what GitHub can
# actually keep, rather than continuing to lose out to its own
# deprioritization of an interval it wasn't honoring anyway. This is the
# backstop scheduler - Cloudflare's own 5-minute cron (cron-worker/
# wrangler.toml) still runs as the fast path when it succeeds; this exists
# specifically to survive the CPU-limit failures on that side (see
# scripts/gh-actions-refresh.mjs for the full story).
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run refresh
        run: node scripts/gh-actions-refresh.mjs
        env:
          # Not secrets - the KV namespace id is already committed in plain
          # sight in cron-worker/wrangler.toml, and an account id is not
          # usable for anything without the API token, which IS a real
          # secret below. Hardcoding these two here means the engineer only
          # has to add the genuinely sensitive secrets, not every ID.
          CLOUDFLARE_ACCOUNT_ID: eb5f3953f8d3713b5282f726c7faf6b5
          CLOUDFLARE_KV_NAMESPACE_ID: 5f69f4ededf24cb89c07ee611c9d5fb4
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Secret names in the repo are GEMINI / GROQ (not *_API_KEY) -
          # matched here rather than asking for a rename, since GitHub only
          # lets you replace a secret's value in place, not its name.
          GEMINI_API_KEY: ${{ secrets.GEMINI }}
          GROQ_API_KEY: ${{ secrets.GROQ }}
          FOOTBALLDATA_API_KEY: ${{ secrets.FOOTBALLDATA_API_KEY }}
